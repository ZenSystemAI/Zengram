name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install API dependencies
        run: cd api && npm ci

      # MCP deps must be installed BEFORE the api test run: the api suite
      # includes tests that import mcp-server/src/index.js (tool annotations).
      - name: Install MCP server dependencies
        run: cd mcp-server && npm ci

      - name: Run tests
        run: cd api && npm test

      - name: Publish MCP server
        run: |
          cd mcp-server
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view @zensystemai/zengram-mcp@$LOCAL_VERSION version 2>/dev/null || echo "")
          if [ "$PUBLISHED" = "$LOCAL_VERSION" ]; then
            echo "v$LOCAL_VERSION already published to npm — skipping"
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
