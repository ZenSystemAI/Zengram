name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install API dependencies
        run: cd api && npm ci

      - name: Install MCP server dependencies
        run: cd mcp-server && npm ci

      # Non-blocking for now: checkJs surfaces a backlog of warnings over the
      # untyped codebase. Drive the warning count to zero, then drop `|| true`
      # to make this a real gate.
      - name: Typecheck (non-blocking)
        working-directory: api
        run: npm run typecheck || true

      # Blocking: high/critical advisories fail the build. Lower-severity noise
      # stays out of the gate by virtue of --audit-level=high.
      - name: Security audit (blocking)
        working-directory: api
        run: npm audit --audit-level=high

      - name: Run tests
        run: cd api && npm test
        env:
          # Run under a real non-UTC zone so timezone regressions surface in CI.
          # TZ-sensitive tests read BRAIN_TIMEZONE and stay TZ-agnostic; this just
          # adds realism, it is not expected to change any result.
          TZ: America/Toronto

      - name: Validate MCP server starts
        working-directory: mcp-server
        run: |
          timeout 5 node src/index.js 2>&1 | head -1 || test $? -eq 124
        env:
          BRAIN_API_KEY: test-key
